<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Custom Theory Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: sticky top bar + step rail; REHOV-style 3D carousel hero; 3D rotating mockup in the designer. Single committed light look: ivory + Pantone Blue 072 C. */
:root{
  --ivory:#F2EEE6; --paper:#FFFDF8; --ink:#1B1A18; --ink-2:#5E5A52; --line:#E2DCCF;
  --blue:#170099; --blue-2:#2B1FC0; --blue-wash:#E9E8F7; --ok:#3F7A4E; --okw:#E3F0E5; --warn:#A06A12; --warnw:#F7EDD9; --crit:#B23A2E; --critw:#F6E1DE;
  --f:"Schibsted Grotesk",system-ui,sans-serif; --m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ivory);color:var(--ink);font:15px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--blue);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.seg{display:flex;background:var(--ivory);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#fff}
.rail{max-width:1240px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}
.rail button{flex:none;border:0;background:none;font-size:12px;padding:5px 10px;border-radius:999px;color:var(--ink-2);white-space:nowrap}
.rail button b{font-family:var(--m);font-weight:500;margin-right:5px;color:var(--blue)}
.rail button.on{background:var(--blue-wash);color:var(--blue);font-weight:600}
main{max-width:1240px;margin:0 auto;padding-block:32px 80px}
h1{font-size:clamp(36px,5.5vw,64px);line-height:1;letter-spacing:-.035em;margin:0 0 16px;font-weight:800;text-wrap:balance}
h2{font-size:clamp(26px,3.4vw,36px);line-height:1.1;letter-spacing:-.025em;margin:0 0 6px;font-weight:700;text-wrap:balance}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
.sub{color:var(--ink-2);margin:0 0 24px;max-width:60ch}
.lbl{font:500 11px/1 var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.blue:hover{background:var(--blue-2)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.pill{display:inline-block;font:500 11px/1 var(--m);padding:5px 8px;border-radius:999px;background:var(--ivory);border:1px solid var(--line);white-space:nowrap}
.pill.blue{background:var(--blue-wash);color:var(--blue);border-color:transparent}
.pill.ok{background:var(--okw);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warnw);color:var(--warn);border-color:transparent}
.note{font-size:12px;color:var(--ink-2)}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
/* hero */
.stagehero{position:relative;background:linear-gradient(180deg,#ECE7DD,#F2EEE6 70%);border:1px solid var(--line);border-radius:22px;overflow:hidden;height:clamp(440px,64vh,640px)}
.stagehero .v3d{position:absolute;inset:0}
.stagehero .tl,.stagehero .tr,.stagehero .bl,.stagehero .br,.stagehero .bc{position:absolute;z-index:2}
.stagehero .tl{left:24px;top:22px;font:500 11px/1.6 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.stagehero .tr{right:24px;top:22px;text-align:right;font:500 11px/1.6 var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.stagehero .bl{left:24px;bottom:64px;display:flex;align-items:flex-end;gap:14px}
.stagehero .bl .num{font:400 56px/0.9 var(--m);letter-spacing:-.04em}
.stagehero .bl .nm{font-size:14px;font-weight:700}
.stagehero .bl .nm small{display:block;font:500 11px var(--m);color:var(--ink-2);font-weight:400}
.stagehero .bc{left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:8px}
.stagehero .bc button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:#C9C2B4}
.stagehero .bc button.on{background:var(--blue);width:22px;border-radius:4px}
.stagehero .br{right:20px;bottom:16px;display:flex;gap:8px}
.circ{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:15px}
.heroText{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end;margin-top:28px}
.props{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;border-top:1px solid var(--line);padding-top:20px}
.props div{font-size:13px;color:var(--ink-2)}
.props b{display:block;color:var(--ink);font-size:14px}
/* tiles */
.tile{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.on{border-color:var(--blue);background:var(--blue-wash)}
.tile .t{font-weight:700}
.tile .d{font-size:13px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gtile{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 8px;font-size:13px;font-weight:600}
.gtile svg{width:64px;height:64px}
.gtile.on{border-color:var(--blue);background:var(--blue-wash);color:var(--blue)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--blue)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px}
/* product */
.prod{display:flex;flex-direction:column;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:14px;min-width:0}
.prod:hover{border-color:var(--blue)}
.prod .ph{background:var(--ivory);border-radius:10px;aspect-ratio:1/1;display:grid;place-items:center}
.prod .ph svg{width:78%;height:auto}
.prod .ph img{width:88%;height:auto;mix-blend-mode:multiply}
.photo{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;margin-top:10px;font-size:13px}
.photo img{width:72px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.spec dt{color:var(--ink-2)}.spec dd{margin:0}
.why{font-size:13px;background:var(--blue-wash);color:var(--blue);padding:8px 10px;border-radius:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:13px}
/* designer */
.designer{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:16px}
.mock{position:relative;background:radial-gradient(ellipse at 50% 40%,#FFFDF8,#ECE7DD);border:1px solid var(--line);border-radius:14px;min-height:520px;overflow:hidden}
.mock .v3d{position:absolute;inset:0;cursor:grab}
.mock .v3d:active{cursor:grabbing}
.mock .ctl{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;z-index:2}
.mock .tag{position:absolute;left:14px;top:12px;z-index:2}
.tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600}
.tog i{width:32px;height:18px;border-radius:999px;background:#CFC8BA;position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on i{background:var(--blue)}
.tog.on i::after{transform:translateX(14px)}
.mock svg.fallback{width:min(100%,440px);display:block;margin:40px auto}
.plc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;line-height:1.15;text-align:center;min-width:0}
.pbtn svg{width:100%;max-width:56px;height:auto}
.pbtn.on{border-color:var(--blue);background:var(--blue-wash);color:var(--blue);font-weight:600}
.grp{font:500 10px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:10px 0 6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px}
.upload{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:13px;color:var(--ink-2);display:block;cursor:pointer}
.upload:hover{border-color:var(--blue)}
/* fit */
.fit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px}
.fit .card{text-align:center}
.fit svg{width:100%;height:auto}
/* price */
.slider{width:100%;accent-color:var(--blue);height:28px}
.qhead{display:flex;justify-content:space-between;align-items:baseline}
.qhead b{font:500 32px var(--m);letter-spacing:-.03em}
.ticks{display:flex;justify-content:space-between;font:11px var(--m);color:var(--ink-2)}
.est{background:var(--blue-wash);border:1px solid #CFCDEE;border-radius:12px;padding:16px;margin-top:14px}
.est .big{font:500 30px var(--m);letter-spacing:-.03em;color:var(--blue)}
.sizes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sizes label{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12px var(--m)}
.sizes input{width:100%;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 4px;background:var(--paper)}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:7px 0;border-bottom:1px solid var(--line)}
.lines td:last-child{text-align:right;font-family:var(--m)}
.total{font-size:40px;font-weight:800;letter-spacing:-.03em}
.verdict{border-radius:12px;padding:16px;margin-top:16px}
.verdict.ok{background:var(--okw)}.verdict.q{background:var(--warnw)}
.verdict ul{margin:6px 0 0;padding-left:18px;font-size:13px}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--blue)}
/* portal */
.tl2{list-style:none;padding:0;margin:0}
.tl2 li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:8px 0;font-size:14px;align-items:center}
.tl2 .c{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.tl2 .done .c{background:var(--blue);border-color:var(--blue)}
.tl2 .cur .c{border-color:var(--blue);box-shadow:inset 0 0 0 3px var(--paper);background:var(--blue)}
.tl2 .cur{font-weight:700;color:var(--blue)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--blue)}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;margin-bottom:10px}
.msg{max-width:80%;padding:9px 12px;border-radius:12px;font-size:14px}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff}
.msg.them{background:var(--ivory)}
.msg small{display:block;font:11px var(--m);opacity:.7;margin-top:2px}
.ver{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:96px 1fr;gap:12px;margin-bottom:10px}
.ver svg{width:100%;height:auto;background:var(--ivory);border-radius:8px}
/* shop */
.shop{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px}
.side{background:var(--ink);color:#D9D5CC;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .logo{color:#fff;font-size:15px;padding:4px 8px 14px}
.side button{border:0;background:none;color:inherit;text-align:left;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between}
.side button.on{background:var(--blue);color:#fff}
.side .shopsel{margin-top:auto;font-size:11px;padding:8px 10px;border-top:1px solid #3A3833;color:#9C978C}
.dash{padding:18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em;font-family:var(--m);font-weight:500}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;min-width:720px}
table.t th{font:500 10px var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:8px 10px;background:var(--ivory);border-bottom:1px solid var(--line)}
table.t td{padding:0 10px;height:36px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:var(--ivory)}
table.t tr.sel{background:var(--blue-wash)}
.qtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qtabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 10px;font-size:12px}
.qtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;margin-top:16px}
.stages{display:flex;gap:4px;flex-wrap:wrap}
.stages button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px;font:500 11px var(--m)}
.stages button.done{background:var(--blue-wash);color:var(--blue);border-color:transparent}
.stages button.cur{background:var(--blue);color:#fff;border-color:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:4px;height:44px}
.bars i{flex:1;background:var(--blue-wash);border-radius:2px 2px 0 0}
.bars i:last-child{background:var(--blue)}
kbd{font:11px var(--m);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--ivory)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:20}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card,.prod,.tile{box-shadow:0 1px 2px rgba(40,30,15,.04),0 10px 30px rgba(40,30,15,.05)}
.card{border-radius:16px}
.hero2{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);gap:40px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:40px 0 0 44px;overflow:hidden;box-shadow:0 20px 60px rgba(40,30,15,.06)}
.hero2 .hcopy{padding-bottom:40px}
.hero2 h1{font-size:clamp(40px,5vw,66px)}
.hero2 .stagehero{border:0;border-radius:0;height:clamp(440px,60vh,600px);background:radial-gradient(ellipse at 55% 55%,#F7F3EB,#EAE4D8 75%)}
.feat{display:flex;flex-wrap:wrap;gap:22px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.feat span{display:flex;align-items:center;gap:8px}
.feat .ic{color:var(--blue);width:20px;height:20px}
.prog{display:flex;flex-direction:column;gap:8px;max-width:420px;margin-bottom:18px}
.prog .bars2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prog .bars2 i{height:4px;border-radius:4px;background:var(--line)}
.prog .bars2 i.on{background:var(--blue)}
.ich{display:flex;align-items:center;gap:10px}
.ich .ic{color:var(--blue);width:26px;height:26px}
.tile .ic{width:30px;height:30px;color:var(--ink);margin-bottom:6px}
.tile.on .ic{color:var(--blue)}
.upload .ic{color:var(--ink);margin:0 auto 4px;display:block}
.ptype{display:flex;gap:8px;flex-wrap:wrap}
.ptype button{width:56px;height:52px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:6px}
.ptype button.on{border-color:var(--blue);background:var(--blue-wash)}
.ptype svg{width:100%;height:100%}
.fit2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.phone{width:300px;max-width:100%;aspect-ratio:9/18.5;border:11px solid var(--ink);border-radius:44px;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(30,20,10,.18)}
.phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:84px;height:20px;border-radius:999px;background:var(--ink);z-index:3}
.phone .pbar{position:absolute;top:36px;left:16px;right:16px;display:flex;justify-content:space-between;font-weight:800;font-size:13px;z-index:2}
.phone .v3d{position:absolute;top:60px;left:0;right:0;bottom:120px;cursor:grab}
.phone .deg{position:absolute;bottom:92px;left:0;right:0;text-align:center;font:500 12px var(--m);color:var(--ink-2);z-index:2}
.phone .thumbs{position:absolute;bottom:22px;left:12px;right:12px;display:flex;gap:6px;justify-content:center;z-index:2}
.phone .thumbs button{width:48px;height:56px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:2px;overflow:hidden}
.phone .thumbs button.on{border-color:var(--blue)}
.phone .thumbs img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.adapt .sizesrow{max-width:520px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px;text-align:center}
.adapt svg{width:100%;height:auto;background:var(--ivory);border-radius:12px}
.prodrow{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.prodrow img{width:72px;background:#fff;border-radius:8px}
.side .si{display:flex;align-items:center;gap:10px}
.side .ic{width:17px;height:17px}
.scale{margin:16px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--blue);color:var(--blue);border-radius:999px;padding:12px 20px;font-weight:700;max-width:420px;background:var(--paper)}
.outline{border:1.5px solid var(--blue);color:var(--blue);background:var(--paper)}
.marquee{overflow:hidden;margin-top:28px;border-block:1px solid var(--line);padding-block:14px;background:var(--paper);border-radius:14px}

function loadDesign(id,step=4){const d=SHOP_DESIGNS.find(x=>x.id===id);if(!d)return;const b=BLANKS.find(x=>x.id===d.blank),c=b.cols.find(x=>x.name===d.color)||b.cols[0];
 Object.assign(S,{blank:b,gtype:b.type,color:c.hex,placements:{...dObj(d).pl},art2:{...d.art},inkP:{...(d.ink||{})},tr:JSON.parse(JSON.stringify(d.tr||{})),method:d.method,colors:d.colors,ed:Object.keys(d.art)[0],auto:true,cv:'edit',loaded:d.id,dname:d.name,mode:'customer'});

function designCard(d){const b=BLANKS.find(x=>x.id===d.blank),c=b.cols.find(x=>x.name===d.color)||b.cols[0],D=dObj(d),pls=placementsFor(b.type).filter(p=>d.art[p.id]),back=pls.some(p=>p.side==='back');

/* ================= shop ================= */
function shopView(){
 const Q={all:()=>true,quote:o=>o.stage==='quote_requested',art:o=>o.stage==='art_prep',press:o=>['approved','blanks_ordered','in_production','qc'].includes(o.stage)&&o.mode==='in_house',vendor:o=>o.mode==='outsourced'&&['approved','blanks_ordered','in_production'].includes(o.stage),ship:o=>o.stage==='ready',risk:o=>o.risk};
 const QL={all:'All',quote:'Needs quote',art:'Print prep',press:'On press',vendor:'At vendor',ship:'Ready to ship',risk:'At risk'};
 const list=ORDERS.filter(Q[S.queue]),o=ORDERS.find(x=>x.id===S.sel)||ORDERS[0],ci=STAGES.indexOf(o.stage);
 const pill=st=>`<span class="pill ${['in_production','qc','blanks_ordered'].includes(st)?'blue':['approved','ready','shipped','complete'].includes(st)?'ok':st==='quote_requested'?'warn':''}">${STAGE_L[st]}</span>`;
 const byM=k=>ORDERS.filter(x=>x.method===k&&!['shipped','complete'].includes(x.stage)).length;
 let body='';
 if(S.shopTab==='orders')body=`
  <div class="kpis"><div class="kpi"><span class="lbl">This month</span><b>$124,560</b><span class="note" style="color:var(--ok)">+18% vs Feb</span></div><div class="kpi"><span class="lbl">Open orders</span><b>${ORDERS.filter(x=>!['shipped','complete'].includes(x.stage)).length}</b><span class="note">${ORDERS.filter(x=>x.mode==='outsourced').length} outsourced</span></div><div class="kpi"><span class="lbl">Waiting on customer</span><b>${ORDERS.filter(x=>x.stage==='awaiting_payment').length}</b><span class="note">payments</span></div><div class="kpi"><span class="lbl">Revenue trend</span><div class="bars">${[30,42,38,55,61,58,80].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div></div>
  <div class="qtabs">${Object.keys(QL).map(k=>`<button class="${S.queue===k?'on':''}" onclick="S.queue='${k}';render()">${QL[k]} <span class="mono">${ORDERS.filter(Q[k]).length}</span></button>`).join('')}</div>
  <div class="tw"><table class="t"><thead><tr><th>Order</th><th>Customer</th><th>Item</th><th>Qty</th><th>Method</th><th>Where</th><th>Due</th><th>Status</th><th style="text-align:right">Total</th></tr></thead><tbody>
  ${list.map(x=>`<tr class="${x.id===o.id?'sel':''}" onclick="S.sel='${x.id}';render()"><td class="mono">${x.id}${x.mine?' <span class="pill blue">new</span>':''}</td><td>${esc(x.cust)}</td><td>${esc(x.item)}</td><td class="mono">${x.qty}</td><td>${METHODS[x.method].l}</td><td>${x.mode==='in_house'?'In-house':'Outsourced'}</td><td class="mono" style="${x.risk?'color:var(--crit);font-weight:600':''}">${x.due}${x.risk?' ⚠':''}</td><td>${pill(x.stage)}</td><td class="mono" style="text-align:right">${x.total?money(x.total):'—'}</td></tr>`).join('')||`<tr><td colspan="9" class="note">Nothing in this queue.</td></tr>`}</tbody></table></div>
  <div class="detail"><div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${o.id} · ${esc(o.cust)}</h3>${pill(o.stage)}</div><p class="note" style="margin:4px 0 12px">${esc(o.item)} · ${o.qty} pcs · ${METHODS[o.method].l} · due ${o.due}</p>
   <div class="lbl" style="margin-bottom:6px">Move stage</div><div class="stages">${STAGES.map((s,i)=>`<button class="${i<ci?'done':i===ci?'cur':''}" onclick="ORDERS.find(x=>x.id==='${o.id}').stage='${s}';toast('${o.id} → ${STAGE_L[s]}');render()">${STAGE_L[s]}</button>`).join('')}</div>
   <div class="lbl" style="margin:14px 0 6px">Production steps</div><div class="note">${o.mode==='in_house'?({screen:'Burn screens → Press → Cure → QC',dtf:'Print transfers → Press → QC',emb:'Digitize → Sew → Trim → QC'})[o.method]:'Sent to vendor → Vendor in progress → Received → QC'}</div></div>
   <div class="card"><div class="lbl" style="margin-bottom:6px">Fulfilment</div><div class="chips" style="margin-bottom:10px">${['in_house','outsourced'].map(m=>`<button class="chip ${o.mode===m?'on':''}" onclick="ORDERS.find(x=>x.id==='${o.id}').mode='${m}';render()">${m==='in_house'?'In-house':'Outsourced'}</button>`).join('')}</div>
   ${o.mode==='outsourced'?`<div class="field"><span class="lbl">Vendor</span><select id="vendor" onchange="ORDERS.find(x=>x.id==='${o.id}').vendor=this.value">${VENDORS.map(v=>`<option ${o.vendor===v?'selected':''}>${v}</option>`).join('')}</select></div><p class="note mono">Vendor PO: VP-${o.id.slice(3)} · due back ${o.due}</p>`:`<p class="note">Assigned to press 2 · ${o.qty} pcs</p>`}
   <div class="lbl" style="margin:12px 0 6px">Production queue</div><div class="note">Embroidery (${byM('emb')}) · DTF (${byM('dtf')}) · Screen print (${byM('screen')})</div></div></div>
  <p class="note" style="margin-top:10px">Shortcuts in the real app: <kbd>J</kbd>/<kbd>K</kbd> move rows · <kbd>S</kbd> change stage · <kbd>/</kbd> search</p>`;
 else if(S.shopTab==='designs')body=designsView();
 else if(S.shopTab==='customers')body=`<h3>Customers</h3><div class="tw"><table class="t"><thead><tr><th>Customer</th><th>Orders</th><th>Lifetime</th><th>Last order</th></tr></thead><tbody>${[...new Set(ORDERS.map(x=>x.cust))].map(c=>{const os=ORDERS.filter(x=>x.cust===c);return `<tr><td>${esc(c)}</td><td class="mono">${os.length}</td><td class="mono">${money(os.reduce((a,x)=>a+x.total,0))}</td><td class="mono">${os[0].id}</td></tr>`}).join('')}</tbody></table></div>`;
 else body=`<h3>Analytics</h3><div class="kpis"><div class="kpi"><span class="lbl">Quote → order</span><b>64%</b></div><div class="kpi"><span class="lbl">Instant checkout</span><b>41%</b></div><div class="kpi"><span class="lbl">Avg. turnaround</span><b>8.2 d</b></div><div class="kpi"><span class="lbl">Reorder rate</span><b>38%</b></div></div><p class="note">Sample figures.</p>`;
 return `<section class="screen"><div class="shop"><aside class="side"><div class="logo"><span class="wmk" aria-label="Custom Theory">CUSTOM<br>THEORY<sup>®</sup></span></div>${[['orders','Orders','orders'],['designs','Designs','layers'],['customers','Customers','users'],['analytics','Analytics','chart']].map(([k,l,i])=>`<button class="${S.shopTab===k?'on':''}" onclick="S.shopTab='${k}';render()"><span class="si">${ic(i)}${l}</span>${k==='orders'?`<span class="mono">${ORDERS.length}</span>`:''}</button>`).join('')}<button onclick="S.queue='press';S.shopTab='orders';render()"><span class="si">${ic('press')}Production</span></button><button onclick="toast('Pricing rules, catalog and staff live here.')"><span class="si">${ic('gear')}Settings</span></button><div class="shopsel">Shop: Custom Theory (tenant 1)<br>Built for multiple shops</div></aside><div class="dash">${body}</div></div><div class="scale">${ic('users')}Built to scale for multiple print shops</div></section>`;
}

let LASTKEY='';function render(){rail();$('#app').innerHTML=S.mode==='shop'?shopView():V[S.step]();const key=S.mode+S.step+(S.mode==='shop'?S.shopTab:'');if(key!==LASTKEY){LASTKEY=key;const sc=$('#app .screen');if(sc)sc.classList.add('enter')}if(S.mode==='customer'&&S.step===0){const c=document.getElementById('clus');if(c){c.classList.add('noanim');layoutClus();heroInit();S._front=S.hero;requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.remove('noanim')))}}mount3D();if(S.mode==='customer'&&S.step===4){const sn=snapS();if(HIST[HIST.length-1]!==sn){HIST.push(sn);if(HIST.length>100)HIST.shift();if(!S._rest)FUT=[]}}}
if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load('40px "Archivo Black"'),document.fonts.load('800 40px "Schibsted Grotesk"')]).then(()=>{S.fontsOK=1;clearArtCache();const v=V3.hero;if(v&&v.items)v.items.forEach(it=>{it.pivot.remove(it.g);disposeObj(it.g);it.g=v.mk(it.h);it.pivot.add(it.g)});render()}).catch(()=>{});
render();
